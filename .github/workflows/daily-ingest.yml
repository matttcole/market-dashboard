name: Daily Market Data Ingest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Create tables if they don't exist
        run: sqlite3 market.db < schema.sql
      
      - name: Backfill inflation history (first run only)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ ! -f market.db ] || [ ! -s market.db ]; then
            python3 backfill_inflation_history.py
          fi
      
      - name: Ingest FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 ingest_fred.py

        - name: Ingest inflation history
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 ingest_inflation_with_history.py --fred-key ${{ secrets.FRED_API_KEY }} > inflation_output.json


      
      - name: Ingest BoC and StatCan data
        run: python3 ingest_boc_statcan.py
      
      - name: Ingest crypto data
        run: python3 ingest_crypto.py
      
      - name: Ingest BoC rate expectations
        run: python3 ingest_boc_expectations.py
      
      - name: Generate snapshot
        run: python3 generate_snapshot.py
      
      - name: Commit and push snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add inflation_history.json snapshot.json
          git commit -m "Daily snapshot: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
