<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .header {
            max-width: 1400px;
            margin: 0 auto 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .header-text h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header-text .meta {
            font-size: 12px;
            color: #888;
        }
        
        .header-buttons {
            flex-shrink: 0;
            display: flex;
            gap: 10px;
        }
        
        .policy-btn {
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        
        .cme-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .cme-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        .boc-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }
        
        .boc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(231, 76, 60, 0.4);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .tile {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 20px;
            transition: all 0.2s;
        }
        
        .tile:hover {
            border-color: #555;
            background: #222;
        }
        
        .tile-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 12px;
        }
        
        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .tile-value {
            font-size: 24px;
            font-weight: 600;
            font-family: "Monaco", "Courier New", monospace;
        }
        
        .tile-flag {
            font-size: 20px;
        }
        
        .curve-values {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .curve-value {
            flex: 1;
        }
        
        .curve-label {
            font-size: 10px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .curve-rate {
            font-size: 18px;
            font-weight: 600;
            color: #64b5f6;
        }
        
        .tile-date {
            font-size: 11px;
            color: #666;
        }
        
        .rates .tile-value { color: #64b5f6; }
        .inflation .tile-value { color: #ff6b6b; }
        .labour .tile-value { color: #51cf66; }
        .growth .tile-value { color: #ffa94d; }
        .crypto .tile-value { color: #f0ad4e; }
        .fx .tile-value { color: #9575cd; }
        .sentiment .tile-value { color: #ef5350; }
        .policy .tile-value { color: #a78bfa; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #2a1a1a;
            border: 1px solid #8b4545;
            color: #ff8a8a;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-text">
            <h1>Market Dashboard</h1>
            <div class="meta">
                <span id="lastUpdated">Loading...</span>
            </div>
        </div>
        <div class="header-buttons">
            <a href="https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html" target="_blank" class="policy-btn cme-btn">
                Fed Probabilities →
            </a>
            <a href="https://www.m-x.ca/en/trading/tools/canadian-interest-rate-expectations" target="_blank" class="policy-btn boc-btn">
                BoC Expectations →
            </a>
        </div>
    </div>
    
    <div class="container" id="dashboard">
        <div class="loading">Loading data...</div>
    </div>
    
    <script>
        const SERIES_LABELS = {
            "us.rate.effr": "Fed Rate",
            "us.rate.2y": "US 2Y",
            "us.rate.5y": "US 5Y",
            "us.rate.10y": "US 10Y",
            "us.spread.2s10s": "US 2s10s Spread",
            "us.spread.3m10y": "US 3m10y Spread",
            "us.inflation.pce": "US PCE (YoY)",
            "us.inflation.pce.core": "US Core PCE (YoY)",
            "us.inflation.cpi": "US CPI (YoY)",
            "us.inflation.cpi.core": "US Core CPI (YoY)",
            "us.inflation.5y5y_fwd": "US 5y5y Forward",
            "us.labour.unemployment": "US Unemployment",
            "us.labour.payrolls": "US Payrolls",
            "us.labour.initial_claims": "Initial Claims",
            "us.growth.gdp_rate": "US GDP Growth Rate",
            "us.growth.gdp_nowcast": "US GDP Nowcast",
            "ca.fx.usdcad": "USD/CAD",
            "ca.rate.2y": "Canada 2Y",
            "ca.rate.5y": "Canada 5Y",
            "ca.rate.10y": "Canada 10Y",
            "ca.rate.policy": "BoC Policy Rate",
            "ca.inflation.cpi": "Canada CPI (YoY)",
            "btc.price.usd": "BTC",
            "btc.price.cad": "BTC (CAD)",
            "eth.price.usd": "ETH",
            "eth.price.cad": "ETH (CAD)",
            "crypto.mcap.usd": "Crypto Market Cap",
            "btc.dominance": "BTC Dominance",
            "stablecoin.supply.usd": "Stablecoin Supply",
            "fear.greed.index": "Fear & Greed",
        };
        
        const HIDDEN_SERIES = [
            "us.rate.fed.upper",
            "us.rate.fed.lower",
            "us.rate.sofr",
            "us.rate.30y",
            "ca.rate.corra",
        ];
        
        const INFLATION_SERIES = [
            "ca.inflation.cpi",
            "us.inflation.cpi",
            "us.inflation.cpi.core",
            "us.inflation.pce",
            "us.inflation.pce.core",
        ];
        
        const CURVES = {
            "us_curve": {
                label: "US Curve",
                flag: "🇺🇸",
                category: "rates",
                series: ["us.rate.2y", "us.rate.5y", "us.rate.10y"],
                labels: ["2Y", "5Y", "10Y"],
            },
            "ca_curve": {
                label: "Canada Curve",
                flag: "🇨🇦",
                category: "rates",
                series: ["ca.rate.2y", "ca.rate.5y", "ca.rate.10y"],
                labels: ["2Y", "5Y", "10Y"],
            },
        };
        
        function categorizeSeriesKey(key) {
            if (key === "ca.rate.policy") return "rates";
            if (key.includes("us.rate") || key.includes("ca.rate")) return "rates";
            if (key.includes("us.inflation") || key.includes("ca.inflation")) return "inflation";
            if (key.includes("us.labour")) return "labour";
            if (key.includes("us.growth")) return "growth";
            if (key.includes("ca.fx")) return "fx";
            if (key.includes("btc") || key.includes("eth") || key.includes("crypto") || key.includes("stablecoin") || key.includes("fear.greed")) return "crypto";
            return "other";
        }
        
        function getFlag(series_key) {
            if (series_key.startsWith("us.") || series_key === "us_curve") return "🇺🇸";
            if (series_key.startsWith("ca.") || series_key === "ca_curve") return "🇨🇦";
            return "";
        }
        
        function formatValue(series_key, value) {
            if (series_key.includes("price")) {
                return `$${value.toLocaleString("en-US", { maximumFractionDigits: 2 })}`;
            }
            if (series_key.includes("mcap") || series_key.includes("supply")) {
                return `$${(value / 1e12).toLocaleString("en-US", { maximumFractionDigits: 2 })}T`;
            }
            if (series_key.includes("dominance") || series_key.includes("greed")) {
                return `${value.toFixed(1)}%`;
            }
            if (series_key.includes("inflation") || series_key.includes("rate") || series_key.includes("spread")) {
                return `${value.toFixed(2)}%`;
            }
            if (series_key.includes("unemployment")) {
                return `${value.toFixed(1)}%`;
            }
            if (series_key.includes("payrolls") || series_key.includes("claims")) {
                return `${(value / 1000).toLocaleString("en-US", { maximumFractionDigits: 0 })}k`;
            }
            if (series_key.includes("gdp")) {
                return `${value.toFixed(2)}%`;
            }
            return value.toLocaleString("en-US", { maximumFractionDigits: 2 });
        }
        
        async function loadDashboard() {
            try {
                const response = await fetch("snapshot.json");
                const data = await response.json();
                
                document.getElementById("lastUpdated").textContent = 
                    `Last updated: ${new Date(data._meta.generated_at).toLocaleString()}`;
                
                const grouped = {};
                const policyTiles = [];
                
                if (data.fed_consensus && data.fed_consensus.outcome) {
                    policyTiles.push({
                        series_key: "fed.consensus",
                        label: "Fed Next Decision",
                        value: data.fed_consensus.outcome.toUpperCase(),
                        value_pct: (data.fed_consensus.probability * 100).toFixed(1),
                        obs_date: "Market Consensus",
                    });
                }
                if (data.boc_consensus && data.boc_consensus.outcome) {
                    policyTiles.push({
                        series_key: "boc.consensus",
                        label: "BoC Next Decision",
                        value: data.boc_consensus.outcome.toUpperCase(),
                        value_pct: (data.boc_consensus.probability * 100).toFixed(1),
                        obs_date: "Market Consensus",
                    });
                }
                if (policyTiles.length > 0) grouped.policy = policyTiles;
                
                for (const [curve_key, curve_def] of Object.entries(CURVES)) {
                    const values = {};
                    let obs_dates = [];
                    
                    for (const series_key of curve_def.series) {
                        if (data.data[series_key]) {
                            const dates = Object.keys(data.data[series_key]).sort().reverse();
                            if (dates.length > 0) {
                                obs_dates.push(dates[0]);
                                const latest_date = dates[0];
                                values[series_key] = data.data[series_key][latest_date];
                            }
                        }
                    }
                    
                    if (Object.keys(values).length === curve_def.series.length) {
                        if (!grouped[curve_def.category]) grouped[curve_def.category] = [];
                        grouped[curve_def.category].push({
                            series_key: curve_key,
                            label: curve_def.label,
                            flag: curve_def.flag,
                            curve_values: values,
                            curve_labels: curve_def.labels,
                            curve_series: curve_def.series,
                            obs_date: obs_dates[0],
                            is_curve: true,
                        });
                    }
                }
                
                const curve_series_flat = Object.values(CURVES).flatMap(c => c.series);
                
                for (const [series_key, observations] of Object.entries(data.data)) {
                    if (HIDDEN_SERIES.includes(series_key) || curve_series_flat.includes(series_key)) {
                        continue;
                    }
                    
                    const category = categorizeSeriesKey(series_key);
                    if (!grouped[category]) grouped[category] = [];
                    
                    // Check if this is an inflation series with YoY calculated
                    if (INFLATION_SERIES.includes(series_key) && data.yoy_rates && data.yoy_rates[series_key]) {
                        const yoy = data.yoy_rates[series_key];
                        grouped[category].push({
                            series_key,
                            label: SERIES_LABELS[series_key] || series_key,
                            flag: getFlag(series_key),
                            value: yoy.rate,
                            obs_date: yoy.current_date,
                            is_yoy: true,
                        });
                    } else {
                        const dates = Object.keys(observations).sort().reverse();
                        if (dates.length > 0) {
                            const latest_date = dates[0];
                            const latest_value = observations[latest_date];
                            grouped[category].push({
                                series_key,
                                label: SERIES_LABELS[series_key] || series_key,
                                flag: getFlag(series_key),
                                value: latest_value,
                                obs_date: latest_date,
                            });
                        }
                    }
                }
                
                let html = "";
                const categoryOrder = ["policy", "rates", "inflation", "labour", "growth", "fx", "crypto"];
                
                for (const category of categoryOrder) {
                    if (!grouped[category] || grouped[category].length === 0) continue;
                    
                    const tiles = grouped[category]
                        .sort((a, b) => a.label.localeCompare(b.label))
                        .map(d => {
                            if (d.value_pct) {
                                return `
                                    <div class="tile">
                                        <div class="tile-label">${d.label}</div>
                                        <div class="tile-value">${d.value}</div>
                                        <div class="tile-date">${d.value_pct}% confidence</div>
                                    </div>
                                `;
                            }
                            if (d.is_curve) {
                                const curve_html = d.curve_labels.map((label, i) => {
                                    const series_key = d.curve_series[i];
                                    const val = d.curve_values[series_key];
                                    return `
                                        <div class="curve-value">
                                            <div class="curve-label">${label}</div>
                                            <div class="curve-rate">${val.toFixed(2)}%</div>
                                        </div>
                                    `;
                                }).join("");
                                
                                return `
                                    <div class="tile">
                                        <div class="tile-header">
                                            <div class="tile-label">${d.label}</div>
                                            <div class="tile-flag">${d.flag}</div>
                                        </div>
                                        <div class="curve-values">${curve_html}</div>
                                        <div class="tile-date">as of ${d.obs_date}</div>
                                    </div>
                                `;
                            }
                            return `
                                <div class="tile">
                                    <div class="tile-header">
                                        <div class="tile-label">${d.label}</div>
                                        <div class="tile-flag">${d.flag}</div>
                                    </div>
                                    <div class="tile-value">${formatValue(d.series_key, d.value)}</div>
                                    <div class="tile-date">as of ${d.obs_date}</div>
                                </div>
                            `;
                        })
                        .join("");
                    
                    html += `
                        <div class="section ${category}">
                            <div class="section-title">${category}</div>
                            <div class="grid">${tiles}</div>
                        </div>
                    `;
                }
                
                document.getElementById("dashboard").innerHTML = html;
                
            } catch (error) {
                document.getElementById("dashboard").innerHTML = 
                    `<div class="error">Error loading dashboard: ${error.message}</div>`;
            }
        }
        
        loadDashboard();
    </script>
</body>
</html>
