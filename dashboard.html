<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            padding: 24px;
            line-height: 1.6;
        }

        .header {
            max-width: 1600px;
            margin: 0 auto 40px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header-text .meta {
            font-size: 13px;
            color: #808080;
            font-weight: 500;
        }

        .header-buttons {
            flex-shrink: 0;
            display: flex;
            gap: 12px;
        }

        .policy-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .cme-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .cme-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.35);
        }

        .boc-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .boc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(231, 76, 60, 0.35);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 48px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b0b0b0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .section-content {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 24px;
            align-items: start;
        }

        .country-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .country-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #888;
            margin-bottom: 4px;
            padding-left: 2px;
        }

        .divider {
            width: 1px;
            background: linear-gradient(180deg, transparent 0%, #3a3a3a 50%, transparent 100%);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .tile {
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 18px;
            position: relative;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            border-radius: 12px;
        }

        .tile.ca::before {
            background: radial-gradient(ellipse at top-right, rgba(220, 50, 50, 0.08) 0%, transparent 70%);
        }

        .tile.us::before {
            background: radial-gradient(ellipse at top-right, rgba(50, 120, 220, 0.08) 0%, transparent 70%);
        }

        .tile:hover {
            border-color: #4a4a4a;
            background: #1a1a1a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transform: translateY(-1px);
        }

        .tile-content {
            position: relative;
            z-index: 1;
        }

        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .tile-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #909090;
            font-weight: 600;
            flex: 1;
        }

        .tile-flag {
            font-size: 18px;
            margin-left: 8px;
        }

        .tile-value {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tile-trend {
            font-size: 16px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            min-width: 28px;
        }

        .tile-trend.up {
            color: #4ade80;
        }

        .tile-trend.down {
            color: #f87171;
        }

        .tile-trend.neutral {
            color: #a0a0a0;
        }

        .tile-date {
            font-size: 12px;
            color: #707070;
            font-weight: 500;
        }

        .tile-confidence {
            font-size: 12px;
            color: #808080;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Category-specific accent colors */
        .rates .tile-value { color: #64b5f6; }
        .inflation .tile-value { color: #ff6b6b; }
        .labour .tile-value { color: #51cf66; }
        .growth .tile-value { color: #ffa94d; }
        .crypto .tile-value { color: #f0ad4e; }
        .fx .tile-value { color: #9575cd; }
        .sentiment .tile-value { color: #ef5350; }
        .policy .tile-value { color: #a78bfa; }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 15px;
        }

        .error {
            background: #2a1515;
            border: 1px solid #8b4545;
            color: #ff8a8a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .section-content {
                grid-template-columns: 1fr;
            }

            .divider {
                display: none;
            }

            .country-label {
                margin-top: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                margin-bottom: 32px;
            }

            .header-text h1 {
                font-size: 26px;
            }

            .header-buttons {
                width: 100%;
                flex-direction: column;
            }

            .policy-btn {
                width: 100%;
                text-align: center;
            }

            .section-title {
                font-size: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .tile {
                padding: 16px;
            }

            .tile-value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-text">
            <h1>Market Dashboard</h1>
            <div class="meta">
                <span id="lastUpdated">Loading...</span>
            </div>
        </div>
        <div class="header-buttons">
            <a href="https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html" target="_blank" class="policy-btn cme-btn">
                Fed Probabilities →
            </a>
            <a href="https://www.m-x.ca/en/trading/tools/canadian-interest-rate-expectations" target="_blank" class="policy-btn boc-btn">
                BoC Expectations →
            </a>
        </div>
    </div>

    <div class="container" id="dashboard">
        <div class="loading">Loading data...</div>
    </div>

    <script>
        const SERIES_LABELS = {
            "us.rate.fed.upper": "Fed Rate (Upper)",
            "us.rate.fed.lower": "Fed Rate (Lower)",
            "us.rate.effr": "EFFR",
            "us.rate.sofr": "SOFR",
            "us.rate.2y": "US 2Y",
            "us.rate.5y": "US 5Y",
            "us.rate.10y": "US 10Y",
            "us.rate.30y": "US 30Y",
            "us.spread.2s10s": "US 2s10s Spread",
            "us.spread.3m10y": "US 3m10y Spread",
            "us.inflation.pce": "US PCE",
            "us.inflation.pce.core": "US Core PCE",
            "us.inflation.cpi": "US CPI",
            "us.inflation.cpi.core": "US Core CPI",
            "us.inflation.5y5y_fwd": "US 5y5y Forward",
            "us.labour.unemployment": "US Unemployment",
            "us.labour.payrolls": "US Payrolls",
            "us.labour.initial_claims": "Initial Claims",
            "us.growth.gdp_real": "US Real GDP",
            "us.growth.gdp_nowcast": "US GDP Nowcast",
            "ca.fx.usdcad": "USD/CAD",
            "ca.rate.2y": "Canada 2Y",
            "ca.rate.5y": "Canada 5Y",
            "ca.rate.10y": "Canada 10Y",
            "ca.rate.corra": "CORRA",
            "ca.rate.policy": "BoC Policy",
            "ca.inflation.cpi": "Canada CPI",
            "btc.price.usd": "BTC",
            "btc.price.cad": "BTC (CAD)",
            "eth.price.usd": "ETH",
            "eth.price.cad": "ETH (CAD)",
            "crypto.mcap.usd": "Crypto Market Cap",
            "btc.dominance": "BTC Dominance",
            "stablecoin.supply.usd": "Stablecoin Supply",
            "fear.greed.index": "Fear & Greed",
        };

        function categorizeSeriesKey(key) {
            if (key === "ca.rate.policy") return "rates";
            if (key.includes("us.rate") || key.includes("ca.rate")) return "rates";
            if (key.includes("us.inflation") || key.includes("ca.inflation")) return "inflation";
            if (key.includes("us.labour")) return "labour";
            if (key.includes("us.growth")) return "growth";
            if (key.includes("ca.fx")) return "fx";
            if (key.includes("btc") || key.includes("eth") || key.includes("crypto") || key.includes("stablecoin") || key.includes("fear.greed")) return "crypto";
            return "other";
        }

        function getCountry(key) {
            if (key.startsWith("us.") || key.startsWith("btc.") || key.startsWith("eth.") || key.startsWith("crypto.") || key.startsWith("stablecoin.") || key.startsWith("fear.")) {
                return "us";
            }
            return "ca";
        }

        function formatValue(series_key, value) {
            if (series_key.includes("price")) {
                return `$${value.toLocaleString("en-US", { maximumFractionDigits: 2 })}`;
            }
            if (series_key.includes("mcap") || series_key.includes("supply")) {
                return `$${(value / 1e12).toLocaleString("en-US", { maximumFractionDigits: 2 })}T`;
            }
            if (series_key.includes("dominance") || series_key.includes("greed")) {
                return `${value.toFixed(1)}%`;
            }
            if (series_key.includes("inflation") || series_key.includes("rate") || series_key.includes("spread")) {
                return `${value.toFixed(2)}%`;
            }
            if (series_key.includes("unemployment")) {
                return `${value.toFixed(1)}%`;
            }
            if (series_key.includes("payrolls") || series_key.includes("claims")) {
                return `${(value / 1000).toLocaleString("en-US", { maximumFractionDigits: 0 })}k`;
            }
            if (series_key.includes("gdp")) {
                return `${value.toFixed(2)}%`;
            }
            return value.toLocaleString("en-US", { maximumFractionDigits: 2 });
        }

        function calculateTrend(observations) {
            const dates = Object.keys(observations).sort().reverse();
            if (dates.length < 2) {
                return { trend: "neutral", symbol: "—", change: null };
            }

            const latest = observations[dates[0]];
            const previous = observations[dates[1]];

            if (latest > previous) {
                return { trend: "up", symbol: "↑", change: latest - previous };
            } else if (latest < previous) {
                return { trend: "down", symbol: "↓", change: latest - previous };
            } else {
                return { trend: "neutral", symbol: "—", change: 0 };
            }
        }

        async function loadDashboard() {
            try {
                const response = await fetch("snapshot.json");
                const data = await response.json();

                document.getElementById("lastUpdated").textContent =
                    `Last updated: ${new Date(data._meta.generated_at).toLocaleString()}`;

                const grouped = {};

                // Add Fed and BoC consensus to policy section
                const policyTiles = [];

                if (data.fed_consensus && data.fed_consensus.outcome) {
                    policyTiles.push({
                        series_key: "fed.consensus",
                        label: "Fed Next Decision",
                        value: data.fed_consensus.outcome.toUpperCase(),
                        value_pct: (data.fed_consensus.probability * 100).toFixed(1),
                        obs_date: "Market Consensus",
                        country: "us",
                    });
                }

                if (data.boc_consensus && data.boc_consensus.outcome) {
                    policyTiles.push({
                        series_key: "boc.consensus",
                        label: "BoC Next Decision",
                        value: data.boc_consensus.outcome.toUpperCase(),
                        value_pct: (data.boc_consensus.probability * 100).toFixed(1),
                        obs_date: "Market Consensus",
                        country: "ca",
                    });
                }

                if (policyTiles.length > 0) {
                    grouped.policy = policyTiles;
                }

                // Add observations
                for (const [series_key, observations] of Object.entries(data.data)) {
                    const category = categorizeSeriesKey(series_key);
                    if (!grouped[category]) grouped[category] = [];

                    const dates = Object.keys(observations).sort().reverse();
                    if (dates.length > 0) {
                        const latest_date = dates[0];
                        const latest_value = observations[latest_date];
                        const trend = calculateTrend(observations);

                        grouped[category].push({
                            series_key,
                            label: SERIES_LABELS[series_key] || series_key,
                            value: latest_value,
                            obs_date: latest_date,
                            country: getCountry(series_key),
                            trend: trend,
                        });
                    }
                }

                // Render
                let html = "";
                const categoryOrder = ["policy", "rates", "inflation", "labour", "growth", "fx", "crypto"];

                for (const category of categoryOrder) {
                    if (!grouped[category] || grouped[category].length === 0) continue;

                    const tiles = grouped[category].sort((a, b) => a.label.localeCompare(b.label));

                    // Separate by country
                    const caTiles = tiles.filter(t => t.country === "ca");
                    const usTiles = tiles.filter(t => t.country === "us");

                    const renderTile = (d) => {
                        const flag = d.country === "ca" ? "🇨🇦" : "🇺🇸";
                        const countryClass = d.country;

                        if (d.value_pct) {
                            return `
                                <div class="tile ${countryClass}">
                                    <div class="tile-content">
                                        <div class="tile-header">
                                            <div class="tile-label">${d.label}</div>
                                            <div class="tile-flag">${flag}</div>
                                        </div>
                                        <div class="tile-value">${d.value}</div>
                                        <div class="tile-confidence">${d.value_pct}% confidence</div>
                                    </div>
                                </div>
                            `;
                        }

                        return `
                            <div class="tile ${countryClass}">
                                <div class="tile-content">
                                    <div class="tile-header">
                                        <div class="tile-label">${d.label}</div>
                                        <div class="tile-flag">${flag}</div>
                                    </div>
                                    <div class="tile-value">
                                        ${formatValue(d.series_key, d.value)}
                                        <span class="tile-trend ${d.trend.trend}">${d.trend.symbol}</span>
                                    </div>
                                    <div class="tile-date">as of ${d.obs_date}</div>
                                </div>
                            </div>
                        `;
                    };

                    const caGrid = caTiles.map(renderTile).join("");
                    const usGrid = usTiles.map(renderTile).join("");

                    html += `
                        <div class="section ${category}">
                            <div class="section-title">${category}</div>
                            <div class="section-content">
                                <div>
                                    <div class="country-label">🇨🇦 Canada</div>
                                    <div class="grid">${caGrid || '<div style="color: #666; padding: 20px; text-align: center;">No data</div>'}</div>
                                </div>
                                <div class="divider"></div>
                                <div>
                                    <div class="country-label">🇺🇸 United States</div>
                                    <div class="grid">${usGrid || '<div style="color: #666; padding: 20px; text-align: center;">No data</div>'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                document.getElementById("dashboard").innerHTML = html;

            } catch (error) {
                document.getElementById("dashboard").innerHTML =
                    `<div class="error">Error loading dashboard: ${error.message}</div>`;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
